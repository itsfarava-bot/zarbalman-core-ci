      ZBM_WP_VERSION: 7.1.2
      XDEBUG_MODE: 'off'
      ZBM_PHPUNIT_FILTER: ${{ needs.dependencies.outputs.filter }}
      ZBM_TEST_SCOPE: focused
    timeout-minutes: 60
    if: needs.dependencies.outputs.scope == 'focused'
